<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAESAN OPERATIONS SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--white-primary:#fff;--white-glow:rgba(255,255,255,.85);--white-dim:rgba(255,255,255,.65);
--white-muted:rgba(255,255,255,.35);--border-light:rgba(255,255,255,.2);--bg-dark:#0b0d12;
--panel-bg:rgba(18,22,31,.75);--input-bg:rgba(255,255,255,.05);--accent-green:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-dark);color:#fff;font-family:'Pretendard',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow-x:hidden}
#bgCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.ambient-glow{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none}
.app-container{width:100%;max-width:900px;display:flex;flex-direction:column;gap:20px;position:relative;z-index:10}
.top-bar{background:var(--panel-bg);border:1px solid var(--border-light);border-radius:16px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.5);flex-wrap:wrap;gap:15px}
.brand-title{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 15px rgba(255,255,255,.6)}
.dashboard-layout{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
.workspace-card{background:var(--panel-bg);border:1px solid var(--border-light);border-radius:20px;padding:35px;backdrop-filter:blur(20px);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-label{display:block;font-size:.85rem;color:var(--white-dim);margin-bottom:8px;font-weight:700}
.hud-input{width:100%;background:var(--input-bg);border:1px solid var(--border-light);color:#fff;padding:14px 16px;border-radius:10px;font-size:.95rem;outline:none}
.white-btn{width:100%;padding:15px;background:#fff;border:none;border-radius:10px;color:#0a0d14;font-size:.95rem;font-weight:800;letter-spacing:1px;cursor:pointer;transition:.3s;box-shadow:0 0 20px rgba(255,255,255,.2);margin-top:10px}
.white-btn:hover{background:#f0f0f0;box-shadow:0 0 30px rgba(255,255,255,.4);transform:translateY(-2px)}

.calc-display{background:linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(20,25,35,0.7) 100%);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:22px;margin:22px 0;box-shadow:inset 0 2px 8px rgba(0,0,0,0.4)}
.calc-title{font-size:0.8rem;font-weight:700;color:var(--white-muted);letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.calc-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:0.95rem}
.calc-line:last-child{margin-bottom:0;padding-top:14px;border-top:1px dashed rgba(255,255,255,0.2)}
.calc-label-sub{color:var(--white-dim);font-size:0.9rem}
.val-highlight{font-weight:800;color:#fff;font-size:1.15rem;letter-spacing:0.5px}

.quick-btns {display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;}
.quick-btn {background: rgba(255,255,255,0.08); border: 1px solid var(--border-light); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s;}
.quick-btn:hover {background: rgba(255,255,255,0.2); border-color: #fff;}
.quick-btn.reset {color: #f87171; border-color: rgba(248,113,113,0.3);}
.quick-btn.reset:hover {background: rgba(248,113,113,0.2);}

.custom-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:1000;opacity:0;pointer-events:none;transition:.3s}
.custom-modal.active{opacity:1;pointer-events:auto}
.modal-box{background:#121620;border:1px solid var(--border-light);border-radius:16px;padding:30px;width:400px;max-width:90vw;text-align:center;box-shadow:0 0 30px rgba(0,0,0,.8)}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.workspace-card{padding:22px}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas><div class="ambient-glow"></div>

<div class="app-container">
<div class="top-bar">
<div class="brand-title">TAESAN</div>
<div style="font-size:0.85rem; color:var(--white-dim)">태산 계산 시스템</div>
</div>

<div class="dashboard-layout">
<div class="workspace-card">

<!-- 환전 보고서 폼 -->
<div id="formExchange">
<h3 style="margin-bottom:20px"><i class="fa-solid fa-sack-dollar" style="margin-right:8px"></i> 환전 계산</h3>
<div class="form-grid">
<div><label class="form-label">고객 고유번호 (#)</label><input class="hud-input" id="exchangeTargetTag" placeholder="#139"></div>
<div><label class="form-label">고객 닉네임</label><input class="hud-input" id="exchangeTargetName" placeholder="지니아스"></div>
</div>

<div style="margin-top:16px">
    <label class="form-label">환전 신청 금액</label>
    <input type="text" class="hud-input" id="exchangeAmount" placeholder="금액 입력(예: 5000000+2000000)" oninput="calculateExchangeFee()">
    
    <!-- 플러스 금액 조절 버튼 -->
    <div class="quick-btns">
        <button type="button" class="quick-btn" onclick="addExchangeAmount(1000000)">+100만</button>
        <button type="button" class="quick-btn" onclick="addExchangeAmount(5000000)">+500만</button>
        <button type="button" class="quick-btn" onclick="addExchangeAmount(10000000)">+1,000만</button>
        <button type="button" class="quick-btn" onclick="addExchangeAmount(50000000)">+5,000만</button>
        <button type="button" class="quick-btn reset" onclick="resetExchangeAmount()">금액 초기화</button>
    </div>
</div>

<div class="calc-display">
<div class="calc-title"><i class="fa-solid fa-calculator"></i> 환전 수수료 산출 내역</div>
<div class="calc-line"><span class="calc-label-sub">신청 원금:</span><span class="val-highlight" id="displayBaseAmount">0 원</span></div>
<div class="calc-line"><span class="calc-label-sub">환전 수수료 (10%):</span><span class="val-highlight" style="color:#f87171; font-size:1rem;" id="displayFeeAmount">- 0 원</span></div>
<div class="calc-line"><span style="font-weight:700; color:#34d399;">고객 지급액:</span><span class="val-highlight" style="color:#34d399;" id="displayNetAmount">0 원</span></div>
</div>

<button type="button" class="white-btn" onclick="resetForms()" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border-light);">입력 내용 초기화</button>
</div>

</div></div></div>

<div id="customModal" class="custom-modal"><div class="modal-box"><div id="modalTitle" style="font-family:'Cinzel',serif;font-weight:800;font-size:1.1rem;margin-bottom:10px">SYSTEM</div><div id="modalDesc" style="color:var(--white-dim);font-size:.9rem;margin-bottom:20px;white-space:pre-line">MESSAGE</div><button onclick="closeModal()" class="white-btn" style="margin-top:0;padding:10px;font-size:.85rem">확인</button></div></div>

<script>
const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}resizeCanvas();addEventListener('resize',resizeCanvas);
const particles=[];for(let i=0;i<50;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:Math.random()*1.5+.5,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4,alpha:Math.random()*.5+.2});
function animateParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${p.alpha})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1});requestAnimationFrame(animateParticles)}animateParticles();

function parseCleanNumber(val){
    if(!val) return 0;
    return parseFloat(String(val).replace(/,/g,''))||0;
}

function showAlert(title,message){document.getElementById('modalTitle').innerText=title;document.getElementById('modalDesc').innerText=message;document.getElementById('customModal').classList.add('active')}
function closeModal(){document.getElementById('customModal').classList.remove('active')}

/* 환전금액에 플러스(+) 버튼 기능 함수 */
function addExchangeAmount(amount) {
    const inputEl = document.getElementById('exchangeAmount');
    let currentValStr = inputEl.value.trim();
    
    if (currentValStr === '') {
        inputEl.value = amount;
    } else {
        inputEl.value = currentValStr + '+' + amount;
    }
    calculateExchangeFee();
}

function resetExchangeAmount() {
    const inputEl = document.getElementById('exchangeAmount');
    inputEl.value = '';
    calculateExchangeFee();
}

/* 입력한 수식 문자열 그대로 유지하며 계산하는 함수 */
function calculateExchangeFee(){
    const inputEl = document.getElementById('exchangeAmount');
    let valStr = inputEl.value;
    
    let a = 0;
    try {
        let sanitized = valStr.replace(/[^0-9+\-*/().]/g, '');
        if(sanitized.trim() !== '') {
            a = Math.floor(Function('"use strict"; return (' + sanitized + ')')() || 0);
        }
    } catch(e) {
        a = 0; 
    }

    let f = Math.floor(a * 0.1);
    document.getElementById('displayBaseAmount').innerText = a.toLocaleString('ko-KR') + " 원";
    document.getElementById('displayFeeAmount').innerText = "- " + f.toLocaleString('ko-KR') + " 원";
    document.getElementById('displayNetAmount').innerText = (a - f).toLocaleString('ko-KR') + " 원";
}

function resetForms(){
    exchangeTargetTag.value='';
    exchangeTargetName.value='';
    exchangeAmount.value='';
    calculateExchangeFee();
}

calculateExchangeFee();
</script>
</body>
</html>
